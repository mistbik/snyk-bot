name: Snyk Security Bot

on:
  # Run on a schedule (every Monday at 9am UTC)
  schedule:
    - cron: "0 9 * * 1"

  # Also run on pushes to main
  push:
    branches: [main, master]
    paths:
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - "requirements.txt"
      - "Pipfile"
      - "Pipfile.lock"
      - "go.mod"
      - "go.sum"
      - "pom.xml"
      - "build.gradle"

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      severity_threshold:
        description: "Minimum severity to report (low/medium/high/critical)"
        required: false
        default: "high"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  snyk-security-scan:
    name: Snyk Vulnerability Scan & Fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        continue-on-error: true

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate with Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Install project dependencies (Node)
        if: hashFiles('package.json') != ''
        run: npm install
        continue-on-error: true

      - name: Install project dependencies (Python)
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt
        continue-on-error: true

      - name: Run Snyk vulnerability scan (JSON output)
        id: snyk_scan
        run: |
          SEVERITY="${{ github.event.inputs.severity_threshold || 'high' }}"
          snyk test \
            --json \
            --severity-threshold=$SEVERITY \
            --all-projects \
            > snyk-report.json 2>&1 || true

          # Count vulnerabilities
          VULN_COUNT=$(cat snyk-report.json | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              if isinstance(data, list):
                  total = sum(len(r.get('vulnerabilities', [])) for r in data)
              else:
                  total = len(data.get('vulnerabilities', []))
              print(total)
          except:
              print(0)
          ")

          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          echo "Found $VULN_COUNT vulnerabilities"

      - name: Apply Snyk fixes
        id: snyk_fix
        if: steps.snyk_scan.outputs.vuln_count > 0
        run: |
          snyk fix --all-projects 2>&1 || true

          # Check if anything was changed
          if git diff --quiet; then
            echo "files_changed=false" >> $GITHUB_OUTPUT
            echo "No files were changed by snyk fix"
          else
            echo "files_changed=true" >> $GITHUB_OUTPUT
            echo "Snyk fix modified dependency files"
          fi

      - name: Create fix branch and PR
        id: create_pr
        if: steps.snyk_fix.outputs.files_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="snyk/fix-$(date +%Y-%m-%d-%H%M)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git config user.name "snyk-bot[bot]"
          git config user.email "snyk-bot@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "fix(security): apply Snyk vulnerability patches [$(date +%Y-%m-%d)]

          Automated security fixes applied by Snyk bot.
          Severity threshold: ${{ github.event.inputs.severity_threshold || 'high' }}

          See linked issue for full vulnerability report.
          Requires human review before merging."

          git push origin $BRANCH_NAME

          # Create the PR
          PR_URL=$(gh pr create \
            --title "🔒 [Snyk Bot] Security vulnerability fixes $(date +%Y-%m-%d)" \
            --body "$(cat scripts/pr-template.md)" \
            --label "security,snyk-bot,needs-review" \
            --draft \
            --head $BRANCH_NAME \
            --base ${{ github.event.repository.default_branch }})

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Created PR: $PR_URL"

      - name: Create tracking issue
        id: create_issue
        if: steps.snyk_scan.outputs.vuln_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate-issue-body.py \
            --report snyk-report.json \
            --pr-url "${{ steps.create_pr.outputs.pr_url }}" \
            --branch "${{ steps.create_pr.outputs.branch_name }}" \
            > issue-body.md

          ISSUE_URL=$(gh issue create \
            --title "🔒 [Snyk Bot] Security scan: $(date +%Y-%m-%d)" \
            --body-file issue-body.md \
            --label "security,snyk-bot,needs-review")

          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
          echo "Created issue: $ISSUE_URL"

      - name: Update PR with issue link
        if: steps.create_pr.outputs.pr_url != '' && steps.create_issue.outputs.issue_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(echo "${{ steps.create_pr.outputs.pr_url }}" | grep -o '[0-9]*$')
          ISSUE_NUM=$(echo "${{ steps.create_issue.outputs.issue_url }}" | grep -o '[0-9]*$')

          gh pr edit $PR_NUM \
            --body "$(cat scripts/pr-template.md)

          ---
          **Tracking issue:** #$ISSUE_NUM
          Closes #$ISSUE_NUM"

      - name: Post summary
        run: |
          echo "## Snyk Bot Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerabilities found | ${{ steps.snyk_scan.outputs.vuln_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fixes applied | ${{ steps.snyk_fix.outputs.files_changed || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PR created | ${{ steps.create_pr.outputs.pr_url || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Issue created | ${{ steps.create_issue.outputs.issue_url || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
